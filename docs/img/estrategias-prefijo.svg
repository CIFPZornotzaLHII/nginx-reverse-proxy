<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Dos formas de publicar un servicio en una subruta: A, el proxy quita el prefijo con rewrite y el servicio recibe GET /hola; B, el proxy no reescribe y el servicio, configurado con su ruta base, recibe GET /dozzle/hola">
  <rect x="0.5" y="0.5" width="959" height="479" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, ui-monospace, Menlo, monospace; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .head { font-size: 16px; font-weight: 700; fill: #111827; }
      .box { font-size: 16px; font-weight: 700; fill: #b45309; }
      .body { font-size: 14px; fill: #111827; }
      .cap { font-size: 13px; fill: #6b7280; }
      .key { font-size: 13px; font-weight: 600; fill: #111827; }
      .code { font-size: 13px; fill: #111827; }
      .chip { fill: #f3f4f6; stroke: #e5e7eb; stroke-width: 1; }
      .wire { fill: none; stroke: #4b5563; stroke-width: 2; }
    </style>
  </defs>

  <!-- Título -->
  <text x="28" y="44" class="sans title">Dos formas de publicar un servicio en una subruta</text>

  <!-- ===================== A · El proxy quita el prefijo ===================== -->
  <rect x="24" y="64" width="450" height="392" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="44" y="94" class="sans head">A · El proxy quita el prefijo</text>

  <!-- lo que pide el navegador -->
  <text x="177" y="124.5" text-anchor="end" class="sans cap">el navegador pide</text>
  <rect x="185" y="108" width="128" height="24" rx="6" class="chip"/>
  <text x="192" y="124.5" class="mono code" textLength="114.4" lengthAdjust="spacingAndGlyphs">GET <tspan fill="#dc2626" font-weight="700">/whoami</tspan>/hola</text>

  <path class="wire" d="M249 132 V154" marker-end="url(#arrow)"/>

  <!-- configuración del proxy -->
  <text x="96" y="180" text-anchor="end" class="sans" font-size="13" font-weight="700" fill="#00742c">proxy</text>
  <rect x="104" y="156" width="290" height="120" rx="6" class="chip"/>
  <rect x="105" y="207" width="288" height="18" fill="#f0fdf4"/>
  <rect x="105" y="207" width="3" height="18" fill="#16a34a"/>
  <text x="118" y="180" class="mono code" textLength="135.85" lengthAdjust="spacingAndGlyphs">location /whoami/ {</text>
  <text x="146.6" y="200" class="mono code" textLength="164.45" lengthAdjust="spacingAndGlyphs">set $destino whoami:80;</text>
  <text x="146.6" y="220" class="mono code" textLength="228.8" lengthAdjust="spacingAndGlyphs">rewrite ^/whoami(/.*)$ $1 break;</text>
  <text x="146.6" y="240" class="mono code" textLength="193.05" lengthAdjust="spacingAndGlyphs">proxy_pass http://$destino;</text>
  <text x="118" y="260" class="mono code" textLength="7.15" lengthAdjust="spacingAndGlyphs">}</text>

  <path class="wire" d="M249 276 V298" marker-end="url(#arrow)"/>

  <!-- servicio -->
  <rect x="104" y="300" width="290" height="76" rx="12" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="118" y="324" class="sans box">whoami</text>
  <text x="118" y="359" class="sans body">recibe</text>
  <rect x="168" y="342" width="78" height="24" rx="6" class="chip"/>
  <text x="175" y="358.5" class="mono code" textLength="64.35" lengthAdjust="spacingAndGlyphs">GET /hola</text>

  <!-- notas -->
  <text x="44" y="404" class="sans key">El servicio cree que está en la raíz /.</text>
  <text x="44" y="424" class="sans cap">Para servicios que no necesitan saber su ruta:</text>
  <text x="44" y="442" class="sans cap">whoami, code-server, Portainer, Adminer…</text>

  <!-- ===================== B · El servicio conoce su prefijo ===================== -->
  <rect x="486" y="64" width="450" height="392" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="506" y="94" class="sans head">B · El servicio conoce su prefijo</text>

  <!-- lo que pide el navegador -->
  <text x="639" y="124.5" text-anchor="end" class="sans cap">el navegador pide</text>
  <rect x="647" y="108" width="128" height="24" rx="6" class="chip"/>
  <text x="654" y="124.5" class="mono code" textLength="114.4" lengthAdjust="spacingAndGlyphs">GET /dozzle/hola</text>

  <path class="wire" d="M711 132 V154" marker-end="url(#arrow)"/>

  <!-- configuración del proxy -->
  <text x="558" y="180" text-anchor="end" class="sans" font-size="13" font-weight="700" fill="#00742c">proxy</text>
  <rect x="566" y="156" width="290" height="120" rx="6" class="chip"/>
  <rect x="567" y="207" width="288" height="18" fill="#e5e7eb" fill-opacity="0.55"/>
  <text x="580" y="180" class="mono code" textLength="135.85" lengthAdjust="spacingAndGlyphs">location /dozzle/ {</text>
  <text x="608.6" y="200" class="mono code" textLength="178.75" lengthAdjust="spacingAndGlyphs">set $destino dozzle:8080;</text>
  <text x="608.6" y="220" class="sans" font-size="12.5" font-style="italic" fill="#6b7280">sin rewrite</text>
  <text x="608.6" y="240" class="mono code" textLength="193.05" lengthAdjust="spacingAndGlyphs">proxy_pass http://$destino;</text>
  <text x="580" y="260" class="mono code" textLength="7.15" lengthAdjust="spacingAndGlyphs">}</text>

  <path class="wire" d="M711 276 V298" marker-end="url(#arrow)"/>

  <!-- servicio -->
  <rect x="566" y="300" width="290" height="76" rx="12" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="324" class="sans box">dozzle</text>
  <rect x="692" y="308" width="150" height="22" rx="6" class="chip"/>
  <text x="699" y="323.5" class="mono code" textLength="135.85" lengthAdjust="spacingAndGlyphs">DOZZLE_BASE=/dozzle</text>
  <text x="580" y="359" class="sans body">recibe</text>
  <rect x="630" y="342" width="128" height="24" rx="6" class="chip"/>
  <text x="637" y="358.5" class="mono code" textLength="114.4" lengthAdjust="spacingAndGlyphs">GET /dozzle/hola</text>

  <!-- notas -->
  <text x="506" y="404" class="sans key">La petición llega intacta.</text>
  <text x="506" y="424" class="sans cap">El servicio se configura con su ruta base</text>
  <text x="506" y="442" class="sans cap">(variable de entorno o ajuste «base URL»).</text>
</svg>
