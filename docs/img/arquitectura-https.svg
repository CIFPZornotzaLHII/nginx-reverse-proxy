<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="Arquitectura con HTTPS: el navegador llega al proxy nginx por los puertos 80 y 443; el server del 80 solo redirige a https; los server www e intranet escuchan en 443 ssl y reenvían a los contenedores web-publica e intranet; el certificado de la carpeta certs se monta en /etc/nginx/certs y es común a los dos">
  <rect x="0.5" y="0.5" width="959" height="619" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <style>
      .s { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .m { font-family: Consolas, ui-monospace, Menlo, monospace; }
      .h1 { font-size: 22px; font-weight: 700; fill: #111827; }
      .box { font-size: 16px; font-weight: 700; }
      .st { font-size: 14px; font-weight: 700; }
      .cap { font-size: 12.5px; fill: #6b7280; }
      .cap12 { font-size: 12px; fill: #6b7280; }
      .net { font-size: 13px; font-weight: 700; fill: #2496ed; }
      .code { font-size: 13px; fill: #111827; }
      .code12 { font-size: 12px; fill: #111827; }
      .dom { font-size: 13px; font-weight: 700; }
      .wire { fill: none; stroke: #4b5563; stroke-width: 2; }
    </style>
    <g id="navegador">
      <rect x="0" y="0" width="156" height="66" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
      <path d="M0 24 V12 a12 12 0 0 1 12 -12 H144 a12 12 0 0 1 12 12 V24 Z" fill="#f3f4f6"/>
      <line x1="0" y1="24" x2="156" y2="24" stroke="#e5e7eb"/>
      <circle cx="14" cy="12" r="3.5" fill="#9ca3af"/><circle cx="26" cy="12" r="3.5" fill="#9ca3af"/><circle cx="38" cy="12" r="3.5" fill="#9ca3af"/>
      <text x="78" y="51" text-anchor="middle" class="s box" fill="#111827">Navegador</text>
    </g>
  </defs>

  <text x="28" y="44" class="s h1">Arquitectura con HTTPS · InnovaTech Solutions</text>

  <!-- Navegador y PC -->
  <use href="#navegador" x="24" y="96"/>
  <rect x="24" y="186" width="176" height="196" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="38" y="210" class="s box" fill="#111827">PC de la empresa</text>
  <text x="38" y="232" class="s cap">Resuelve los nombres</text>
  <text x="38" y="248" class="s cap">(vuestro DNS, o hosts):</text>
  <text x="38" y="270" class="m code12">www.  /  intranet.</text>
  <text x="38" y="288" class="m code12">innovatechsolutions.com</text>
  <text x="38" y="308" class="s cap">→ IP del servidor</text>
  <text x="38" y="334" class="s cap">Con el .crt instalado:</text>
  <text x="38" y="352" class="s cap">candado y sin aviso</text>
  <text x="38" y="368" class="s cap">(Paso 6)</text>

  <!-- Servidor Docker -->
  <rect x="224" y="70" width="712" height="528" rx="16" fill="#f5fbff" stroke="#2496ed" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="240" y="90" class="s net">Servidor Docker · red de Docker</text>

  <!-- Entradas :80 y :443 -->
  <path d="M180 120 H242" class="wire" marker-end="url(#flecha)"/>
  <text x="186" y="112" class="m code12">:80</text>
  <path d="M180 142 H242" class="wire" marker-end="url(#flecha)"/>
  <text x="186" y="160" class="m code12">:443</text>

  <!-- Proxy -->
  <rect x="244" y="102" width="430" height="412" rx="12" fill="#e8f5ec" stroke="#009639" stroke-width="2"/>
  <text x="260" y="126" class="s box" fill="#00742c">proxy <tspan class="m" font-size="13" font-weight="400" fill="#111827">nginx · puertos abiertos: 80 y 443</tspan></text>

  <!-- server :80 (redirección) -->
  <rect x="260" y="142" width="398" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="274" y="164" class="m dom" fill="#4b5563">server · listen 80 (default_server)</text>
  <rect x="272" y="172" width="374" height="22" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="282" y="188" class="m code" xml:space="preserve">cualquier URL  → 301 https://$host$request_uri</text>

  <!-- server www -->
  <rect x="260" y="214" width="398" height="80" rx="10" fill="#ffffff" stroke="#009639" stroke-width="2"/>
  <text x="274" y="236" class="m dom" fill="#00742c">server www.innovatechsolutions.com · 443 ssl</text>
  <rect x="272" y="248" width="374" height="28" rx="6" fill="#ffffff" stroke="#a7d9b8" stroke-width="1"/>
  <text x="282" y="267" class="m code" xml:space="preserve">/             → proxy_pass web-publica:80</text>

  <!-- server intranet -->
  <rect x="260" y="306" width="398" height="120" rx="10" fill="#f1edff" stroke="#7c5cff" stroke-width="2"/>
  <text x="274" y="328" class="m dom" fill="#5b3fe0">server intranet.innovatechsolutions.com · 443 ssl</text>
  <rect x="272" y="340" width="374" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="282" y="359" class="m code" xml:space="preserve">/             → proxy_pass intranet:80</text>
  <rect x="272" y="374" width="374" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="282" y="393" class="m code" fill="#6b7280" xml:space="preserve">/code/  /portainer/  …   → code:8443, …</text>

  <!-- certificado común -->
  <rect x="260" y="438" width="398" height="68" rx="10" fill="#ffffff" stroke="#009639" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="274" y="458" class="s st" font-size="13" fill="#00742c">Común a los server de 443 (fuera de ellos):</text>
  <text x="274" y="478" class="m code12" xml:space="preserve">ssl_certificate      /etc/nginx/certs/innovatech.crt</text>
  <text x="274" y="496" class="m code12" xml:space="preserve">ssl_certificate_key  /etc/nginx/certs/innovatech.key</text>

  <!-- Servicios (sin ports) -->
  <rect x="698" y="102" width="226" height="310" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="712" y="126" class="s st" fill="#111827">Servicios</text>
  <text x="712" y="144" class="s cap">sin ports: solo se llega por el proxy</text>

  <rect x="712" y="226" width="198" height="56" rx="8" fill="#f0fdf4" stroke="#009639" stroke-width="1.5"/>
  <text x="724" y="248" class="m dom" fill="#00742c">web-publica</text>
  <text x="724" y="268" class="s cap12">nginx · carpeta web-publica/</text>
  <path d="M660 254 H710" class="wire" marker-end="url(#flecha)"/>

  <rect x="712" y="338" width="198" height="56" rx="8" fill="#f1edff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="724" y="360" class="m dom" fill="#5b3fe0">intranet</text>
  <text x="724" y="380" class="s cap12">nginx · carpeta intranet/</text>
  <path d="M660 366 H710" class="wire" marker-end="url(#flecha)"/>

  <!-- certs/ (volumen del proxy) -->
  <rect x="712" y="438" width="198" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="724" y="458" class="m dom" fill="#92400e">certs/</text>
  <text x="736" y="475" class="m code12">innovatech.crt</text>
  <text x="736" y="489" class="m code12">innovatech.key</text>
  <text x="724" y="504" class="s cap12">volumen :ro → /etc/nginx/certs</text>
  <path d="M712 472 H660" class="wire" marker-end="url(#flecha)"/>

  <!-- Dónde se declara -->
  <rect x="244" y="528" width="680" height="52" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="260" y="550" class="m code12" xml:space="preserve">docker-compose.yml → proxy: ports "80:80" y "443:443" · volumes ./certs:/etc/nginx/certs:ro</text>
  <text x="260" y="568" class="m code12" xml:space="preserve">proxy/nginx.conf   → ssl_certificate (común) · server 80 → 301 · listen 443 ssl en www e intranet</text>
</svg>
