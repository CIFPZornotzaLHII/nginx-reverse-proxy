# Práctica de reverse proxy: nginx en el puerto 80 reparte las peticiones entre los servicios.
#
#   docker compose up -d                       ← siempre desde esta carpeta
#     http://localhost/              → portal (proxy/web/)
#     http://localhost/code/         → code-server
#     http://localhost/portainer/    → Portainer
#
# Solo el proxy publica un puerto ("ports"). El resto de servicios no son accesibles desde fuera:
# se llega a ellos a través del proxy, que los encuentra por su nombre de servicio (code, portainer…).

services:
  proxy:                        # reverse proxy + portal
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"                 # ¿Puerto 80 ocupado en tu PC? Usa otro: "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # la configuración
      - ./proxy/web:/usr/share/nginx/html:ro                   # la web del portal

  code:                         # VS Code en el navegador → /code/
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      PASSWORD: "${CODE_PASSWORD:?Falta CODE_PASSWORD: crea el fichero .env a partir de .env.template}"
    volumes:
      - code_config:/config
      - ./:/config/workspace    # el propio proyecto: puedes editarlo desde /code/

  portainer:                    # gestión de Docker desde el navegador → /portainer/
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  code_config:
  portainer_data:
