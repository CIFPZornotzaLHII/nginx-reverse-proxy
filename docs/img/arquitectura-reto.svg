<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Arquitectura final del reto: el proxy nginx tiene dos server, www para la web pública e intranet con los servicios por ruta; Duplicati va aparte con su propio nombre porque no funciona en una ruta">
  <rect x="0.5" y="0.5" width="959" height="639" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, ui-monospace, Menlo, monospace; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .box { font-size: 16px; font-weight: 700; }
      .cap { font-size: 12.5px; fill: #6b7280; }
      .net { font-size: 13px; font-weight: 700; fill: #2496ed; }
      .code { font-size: 13px; fill: #111827; }
      .dom { font-size: 13px; font-weight: 700; }
      .wire { fill: none; stroke: #4b5563; stroke-width: 2; }
      .row { fill: #ffffff; stroke: #c4b5fd; stroke-width: 1; }
      .row-www { fill: #ffffff; stroke: #a7d9b8; stroke-width: 1; }
    </style>
  </defs>

  <text x="28" y="44" class="sans title">Arquitectura final del reto · InnovaTech Solutions</text>

  <!-- Navegador -->
  <rect x="24" y="96" width="156" height="66" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <path d="M24 120 V108 a12 12 0 0 1 12 -12 H168 a12 12 0 0 1 12 12 V120 Z" fill="#f3f4f6"/>
  <line x1="24" y1="120" x2="180" y2="120" stroke="#e5e7eb"/>
  <circle cx="38" cy="108" r="3.5" fill="#9ca3af"/><circle cx="50" cy="108" r="3.5" fill="#9ca3af"/><circle cx="62" cy="108" r="3.5" fill="#9ca3af"/>
  <text x="102" y="147" text-anchor="middle" class="sans box" fill="#111827">Navegador</text>

  <!-- DNS -->
  <rect x="24" y="186" width="156" height="150" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="38" y="210" class="sans box" fill="#111827">DNS</text>
  <text x="38" y="232" class="sans cap">En vuestro DNS Linux,</text>
  <text x="38" y="250" class="sans cap">un registro A para:</text>
  <text x="38" y="272" class="mono code">www</text>
  <text x="38" y="290" class="mono code">intranet</text>
  <text x="38" y="308" class="mono code">duplicati</text>
  <text x="38" y="326" class="sans cap">→ IP de este servidor</text>

  <!-- Servidor / red de Docker -->
  <rect x="204" y="70" width="732" height="546" rx="16" fill="#f5fbff" stroke="#2496ed" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="220" y="90" class="sans net">Servidor Docker (Linux) · red de Docker</text>

  <!-- Entrada :80 -->
  <path d="M180 129 H222" class="wire" marker-end="url(#flecha)"/>
  <text x="182" y="148" class="mono code">:80</text>

  <!-- Proxy -->
  <rect x="224" y="102" width="440" height="398" rx="12" fill="#e8f5ec" stroke="#009639" stroke-width="2"/>
  <text x="240" y="126" class="sans box" fill="#00742c">proxy <tspan class="mono" font-size="13" font-weight="400" fill="#111827">nginx · único puerto abierto: 80</tspan></text>

  <!-- server www -->
  <rect x="240" y="142" width="408" height="74" rx="10" fill="#ffffff" stroke="#009639" stroke-width="2"/>
  <text x="254" y="164" class="mono dom" fill="#00742c">server www.innovatechsolutions.com</text>
  <rect x="252" y="176" width="384" height="28" rx="6" class="row-www"/>
  <text x="262" y="195" class="mono code" xml:space="preserve">/             → archivos de www/</text>

  <!-- server intranet -->
  <rect x="240" y="230" width="408" height="190" rx="10" fill="#f1edff" stroke="#7c5cff" stroke-width="2"/>
  <text x="254" y="252" class="mono dom" fill="#5b3fd6">server intranet.innovatechsolutions.com</text>
  <rect x="252" y="262" width="384" height="28" rx="6" class="row"/>
  <text x="262" y="281" class="mono code" xml:space="preserve">/             → archivos de intranet/</text>
  <rect x="252" y="302" width="384" height="28" rx="6" class="row"/>
  <text x="262" y="321" class="mono code" xml:space="preserve">/portainer/   → portainer:9000</text>
  <rect x="252" y="342" width="384" height="28" rx="6" class="row"/>
  <text x="262" y="361" class="mono code" xml:space="preserve">/code/        → code:8443</text>
  <rect x="252" y="382" width="384" height="28" rx="6" class="row"/>
  <text x="262" y="401" class="mono code" xml:space="preserve">/xxx/         → tu servicio</text>

  <!-- server duplicati (excepción) -->
  <rect x="240" y="434" width="408" height="54" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="254" y="456" class="mono dom" fill="#b45309">server duplicati.innovatechsolutions.com</text>
  <text x="254" y="476" class="sans cap">Excepción: Duplicati no funciona en una ruta</text>

  <!-- Destinos -->
  <rect x="700" y="172" width="216" height="46" rx="10" fill="#e8f5ec" stroke="#009639" stroke-width="2"/>
  <text x="714" y="200" class="mono box" fill="#00742c">www/ <tspan class="sans" font-size="12.5" font-weight="400" fill="#6b7280">web pública</tspan></text>

  <rect x="700" y="259" width="216" height="34" rx="10" fill="#f1edff" stroke="#7c5cff" stroke-width="2"/>
  <text x="714" y="281" class="mono box" fill="#5b3fd6">intranet/ <tspan class="sans" font-size="12.5" font-weight="400" fill="#6b7280">tarjetas</tspan></text>

  <rect x="700" y="299" width="216" height="34" rx="10" fill="#e7f8fe" stroke="#13bef9" stroke-width="2"/>
  <text x="714" y="321" class="sans box" fill="#0b7fa8">portainer</text>

  <rect x="700" y="339" width="216" height="34" rx="10" fill="#e6f2fb" stroke="#007acc" stroke-width="2"/>
  <text x="714" y="361" class="sans box" fill="#005a96">code</text>

  <rect x="700" y="379" width="216" height="34" rx="10" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="714" y="401" class="sans box" fill="#b45309">tu servicio <tspan font-size="12.5" font-weight="400" fill="#6b7280">Gitea, Wiki.js…</tspan></text>

  <rect x="700" y="444" width="216" height="34" rx="10" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="714" y="466" class="sans box" fill="#b45309">duplicati <tspan class="mono" font-size="13" font-weight="400" fill="#111827">:8200</tspan></text>

  <path d="M636 190 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M636 276 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M636 316 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M636 356 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M636 396 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M648 461 H698" class="wire" marker-end="url(#flecha)"/>

  <!-- Volúmenes -->
  <text x="224" y="532" class="sans box" fill="#111827">Volúmenes</text>
  <rect x="224" y="542" width="180" height="58" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="236" y="564" class="mono code" font-weight="700">./www</text>
  <text x="236" y="584" class="sans cap">el proxy la sirve</text>
  <rect x="416" y="542" width="308" height="58" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="428" y="564" class="mono code" font-weight="700">./intranet</text>
  <text x="428" y="584" class="sans cap">proxy la sirve · code la edita · duplicati la copia</text>
  <rect x="736" y="542" width="180" height="58" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="748" y="564" class="mono code" font-weight="700">portainer_data</text>
  <text x="748" y="584" class="sans cap">duplicati también la copia</text>
</svg>
