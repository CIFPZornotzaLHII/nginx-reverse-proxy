<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="Arquitectura final del reto: el navegador entra por el puerto 80 al proxy nginx, que tiene un server para la intranet (con rutas opcionales) y un server por subdominio para portainer, code, duplicati y el servicio elegido">
  <rect x="0.5" y="0.5" width="959" height="619" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, ui-monospace, Menlo, monospace; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .box { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #111827; }
      .cap { font-size: 12.5px; fill: #6b7280; }
      .net { font-size: 13px; font-weight: 700; fill: #2496ed; }
      .code { font-size: 13px; fill: #111827; }
      .dom { font-size: 13px; font-weight: 700; }
      .wire { fill: none; stroke: #4b5563; stroke-width: 2; }
      .row { fill: #ffffff; stroke: #c4b5fd; stroke-width: 1; }
      .row-opc { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .srv { fill: #ffffff; stroke: #009639; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Título -->
  <text x="28" y="44" class="sans title">Arquitectura final del reto · InnovaTech Solutions</text>

  <!-- Navegador -->
  <rect x="24" y="96" width="156" height="78" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <path d="M24 120 V108 a12 12 0 0 1 12 -12 H168 a12 12 0 0 1 12 12 V120 Z" fill="#f3f4f6"/>
  <line x1="24" y1="120" x2="180" y2="120" stroke="#e5e7eb"/>
  <circle cx="38" cy="108" r="3.5" fill="#9ca3af"/><circle cx="50" cy="108" r="3.5" fill="#9ca3af"/><circle cx="62" cy="108" r="3.5" fill="#9ca3af"/>
  <text x="102" y="145" text-anchor="middle" class="sans box" fill="#111827">Navegador</text>
  <text x="102" y="163" text-anchor="middle" class="sans cap">un nombre por servicio</text>

  <!-- DNS -->
  <rect x="24" y="198" width="156" height="128" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="38" y="222" class="sans box" fill="#111827">DNS</text>
  <text x="38" y="244" class="sans cap">Vuestro DNS de Linux:</text>
  <text x="38" y="262" class="sans cap">un registro A por</text>
  <text x="38" y="280" class="sans cap">nombre, todos con la</text>
  <text x="38" y="298" class="sans cap">IP de este servidor.</text>
  <text x="38" y="316" class="sans cap">En tu PC: .localhost</text>

  <!-- Leyenda -->
  <rect x="24" y="350" width="34" height="20" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="66" y="365" class="sans cap">opcional</text>

  <!-- Servidor / red de Docker -->
  <rect x="204" y="70" width="732" height="526" rx="16" fill="#f5fbff" stroke="#2496ed" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="220" y="90" class="sans net">Servidor Linux · docker compose up -d · red de Docker</text>

  <!-- Entrada :80 -->
  <path d="M180 135 H222" class="wire" marker-end="url(#flecha)"/>
  <rect x="186" y="122" width="34" height="22" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="203" y="138" text-anchor="middle" class="mono code">:80</text>

  <!-- Proxy -->
  <rect x="224" y="102" width="440" height="372" rx="12" fill="#e8f5ec" stroke="#009639" stroke-width="2"/>
  <text x="240" y="126" class="sans box" fill="#00742c">proxy <tspan class="mono" font-size="13" font-weight="400" fill="#111827">nginx:alpine</tspan></text>
  <text x="240" y="145" class="sans cap">El único con puerto publicado. Un server { } por nombre:</text>

  <!-- server intranet -->
  <rect x="240" y="156" width="408" height="128" rx="10" fill="#f1edff" stroke="#7c5cff" stroke-width="2"/>
  <text x="254" y="177" class="mono dom" fill="#5b3fd6">server intranet.innovatechsolutions.com</text>
  <rect x="252" y="187" width="384" height="26" rx="6" class="row"/>
  <text x="262" y="205" class="mono code" xml:space="preserve">/            → archivos de intranet/</text>
  <rect x="252" y="219" width="250" height="26" rx="6" class="row-opc"/>
  <text x="262" y="237" class="mono code" fill="#6b7280" xml:space="preserve">/code/       → code:8443</text>
  <rect x="252" y="251" width="250" height="26" rx="6" class="row-opc"/>
  <text x="262" y="269" class="mono code" fill="#6b7280" xml:space="preserve">/portainer/  → portainer:9000</text>
  <text x="516" y="244" class="sans cap">rutas opcionales:</text>
  <text x="516" y="262" class="sans cap">solo en la intranet</text>

  <!-- servers por subdominio -->
  <rect x="240" y="300" width="408" height="36" rx="8" class="srv"/>
  <text x="254" y="323" class="mono code"><tspan font-weight="700" fill="#00742c">server</tspan> portainer.innovatechsolutions.com</text>
  <rect x="240" y="342" width="408" height="36" rx="8" class="srv"/>
  <text x="254" y="365" class="mono code"><tspan font-weight="700" fill="#00742c">server</tspan> code.innovatechsolutions.com</text>
  <rect x="240" y="384" width="408" height="36" rx="8" class="srv"/>
  <text x="254" y="407" class="mono code"><tspan font-weight="700" fill="#00742c">server</tspan> duplicati.innovatechsolutions.com</text>
  <rect x="240" y="426" width="408" height="36" rx="8" class="srv"/>
  <text x="254" y="449" class="mono code"><tspan font-weight="700" fill="#00742c">server</tspan> xxx.innovatechsolutions.com</text>

  <!-- Carpeta intranet -->
  <rect x="700" y="156" width="216" height="128" rx="12" fill="#f1edff" stroke="#7c5cff" stroke-width="2"/>
  <text x="714" y="180" class="mono box" fill="#5b3fd6">intranet/</text>
  <text x="714" y="202" class="sans cap">carpeta del repo, montada</text>
  <text x="714" y="220" class="sans cap">como volumen en el proxy</text>
  <text x="714" y="244" class="mono code">index.html · estilo.css</text>
  <text x="714" y="264" class="sans cap">una tarjeta por servicio</text>
  <path d="M636 200 H698" class="wire" marker-end="url(#flecha)"/>

  <!-- Contenedores -->
  <rect x="700" y="299" width="216" height="38" rx="10" fill="#e7f8fe" stroke="#13bef9" stroke-width="2"/>
  <text x="714" y="323" class="sans box" fill="#0b7fa8">portainer <tspan class="mono" font-size="13" font-weight="400" fill="#111827">:9000</tspan></text>
  <rect x="700" y="341" width="216" height="38" rx="10" fill="#e6f2fb" stroke="#007acc" stroke-width="2"/>
  <text x="714" y="365" class="sans box" fill="#005a96">code <tspan class="mono" font-size="13" font-weight="400" fill="#111827">:8443</tspan></text>
  <rect x="700" y="383" width="216" height="38" rx="10" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="714" y="407" class="sans box" fill="#b45309">duplicati <tspan class="mono" font-size="13" font-weight="400" fill="#111827">:8200</tspan></text>
  <rect x="700" y="425" width="216" height="38" rx="10" fill="#fff7e6" stroke="#f59e0b" stroke-width="2"/>
  <text x="714" y="449" class="sans box" fill="#b45309">tu servicio <tspan class="sans" font-size="12.5" font-weight="400" fill="#6b7280">Gitea, Kuma…</tspan></text>

  <path d="M648 318 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M648 360 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M648 402 H698" class="wire" marker-end="url(#flecha)"/>
  <path d="M648 444 H698" class="wire" marker-end="url(#flecha)"/>

  <!-- Volúmenes -->
  <text x="224" y="504" class="sans box" fill="#111827">Volúmenes</text>
  <rect x="224" y="514" width="296" height="66" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="236" y="536" class="mono code" font-weight="700">./intranet</text>
  <text x="236" y="554" class="sans cap">proxy la sirve · code la edita</text>
  <text x="236" y="571" class="sans cap">duplicati hace su copia de seguridad</text>
  <rect x="532" y="514" width="200" height="66" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="544" y="536" class="mono code" font-weight="700">portainer_data</text>
  <text x="544" y="554" class="sans cap">datos de Portainer</text>
  <text x="544" y="571" class="sans cap">duplicati también lo copia</text>
  <rect x="744" y="514" width="172" height="66" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="756" y="536" class="mono code" font-weight="700">docker.sock</text>
  <text x="756" y="554" class="sans cap">Portainer controla</text>
  <text x="756" y="571" class="sans cap">Docker por aquí</text>
</svg>
